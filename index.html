<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>2027 AI 예산 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 예산서 열람대 — 요약 띠 → 도구줄 → 부처별 표, 행을 펼치면 내역사업 상세 */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#EEF1F4; --ink:#17212C; --muted:#5A6676; --faint:#8A95A3; --line:#DCE1E7;
  --accent:#23508F;
  --msit:#2F63D6; --mcst:#A8407A; --motie:#B5770C; --mss:#0F7F8E; --vc:#5B45C2;
  --up:#1D7F55; --down:#C0432C;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --surface:#171E26; --sunk:#1D252F; --ink:#E6EBF0; --muted:#9AA6B4; --faint:#6E7A88; --line:#2A3440;
  --accent:#7FA8E8; --msit:#6E97F0; --mcst:#DB7BAF; --motie:#E0A840; --mss:#4CC3D2; --vc:#A595F2; --up:#4CC08A; --down:#F07B63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#171E26; --sunk:#1D252F; --ink:#E6EBF0; --muted:#9AA6B4; --faint:#6E7A88; --line:#2A3440;
  --accent:#7FA8E8; --msit:#6E97F0; --mcst:#DB7BAF; --motie:#E0A840; --mss:#4CC3D2; --vc:#A595F2; --up:#4CC08A; --down:#F07B63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{margin:4px 0 6px;font-size:28px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}

/* summary */
.view-switch{display:inline-flex;align-self:flex-start;max-width:100%;padding:4px;gap:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.view-switch button{font:inherit;font-size:15px;border:0;background:none;color:var(--muted);padding:11px 20px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;min-width:0;transition:background .15s,color .15s}
.view-switch button:hover{color:var(--ink);background:var(--sunk)}
.view-switch button b{font-weight:700;white-space:nowrap}
.view-switch button span{font-family:var(--f-num);font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--sunk)}
.view-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.view-switch button[data-v="vc"]:not([aria-pressed="true"]) b{color:var(--vc)}
.view-switch button[data-v="vc"][aria-pressed="true"]{background:var(--vc);color:var(--bg)}
.view-switch button[aria-pressed="true"] span{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.view-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.view-switch{align-self:stretch}.view-switch button{flex:1;padding:10px 12px;font-size:14px}}
.pill.vc{color:var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent);border-color:transparent}
.tile.zero{opacity:.45}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--c,var(--ink))}
.tile:hover{border-color:var(--c,var(--ink))}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile[aria-pressed="true"]{background:var(--sunk);border-color:var(--c,var(--ink))}
.tile .t-name{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.tile .t-name small{color:var(--muted);font-weight:400}
.tile .t-val{font-size:22px;font-weight:600}
.tile .t-val u{text-decoration:none;font-family:var(--f-sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.tile .t-sub{font-size:12px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);padding:7px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,.btn{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}

/* dept section */
.dept{display:flex;flex-direction:column;gap:10px}
.dept-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-left:12px;border-left:4px solid var(--c)}
.dept-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.dept-head .meta{color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
.main{min-width:760px}
.main th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.main th.r,.main td.r{text-align:right}
.main td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.main tr.row{cursor:pointer}
.main tr.row:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.main tr.row.open td{background:var(--sunk);border-bottom-color:transparent}
.main tr:last-child td{border-bottom:0}
.p-name{font-weight:600;display:flex;gap:8px;align-items:flex-start}
.p-name .chev{flex:none;width:16px;color:var(--faint);transition:transform .15s;font-family:var(--f-num)}
.open .chev{transform:rotate(90deg)}
.p-sub{font-size:12px;color:var(--muted);margin:2px 0 0 24px}
.p-sub .code{font-family:var(--f-num);color:var(--faint)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.new{color:var(--accent)}
.pill.cont{color:var(--muted)}
.pill.rnd{color:var(--faint);border-style:dashed;font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.val{font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.delta{font-size:13px;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--faint)}
.delta small{display:block;font-size:11px;opacity:.85}

/* detail */
tr.detail>td{padding:0 12px 18px;background:var(--sunk)}
.detail-in{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.info{display:flex;flex-direction:column;gap:10px;font-size:13px;min-width:0}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px}
.info dt{color:var(--muted);white-space:nowrap}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.info h4,.items h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.hist{display:flex;align-items:flex-end;gap:6px;height:64px;padding-top:4px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.hist i{display:block;width:100%;background:var(--c);opacity:.35;border-radius:2px 2px 0 0;min-height:1px}
.hist div.cur i{opacity:1}
.hist span{font-size:10px;color:var(--faint)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi div{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.kpi b{font-weight:500;font-family:var(--f-num);white-space:nowrap}
.items{min-width:0}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.item:first-of-type{border-top:0;padding-top:4px}
.item .i-name{font-weight:600}
.item .i-nums{text-align:right;white-space:nowrap;font-size:13px}
.item .i-nums .from{color:var(--faint)}
.item .i-desc{grid-column:1/-1;color:var(--ink);font-size:13px;white-space:pre-line;max-width:78ch}
.item .i-goal{grid-column:1/-1;color:var(--muted);font-size:12px;max-width:78ch}
.item .i-goal b{font-weight:600}
.item.ended .i-name{color:var(--faint);text-decoration:line-through}
.item details{grid-column:1/-1;font-size:12px}
.item summary{cursor:pointer;color:var(--accent);width:max-content}
.item summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calc{margin:6px 0 0;padding:8px 10px;background:var(--sunk);border-radius:4px;font-family:var(--f-num);font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.ibar{grid-column:1/-1;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.ibar i{display:block;height:100%;background:var(--c);opacity:.7}
.dl-ico,.dl-btn{color:var(--accent);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;white-space:nowrap;background:var(--surface)}
.dl-ico{padding:3px 7px;font-family:var(--f-num)}
.dl-ico::before,.dl-btn::before{content:"↓ "}
.dl-btn{padding:7px 10px;text-align:center}
.dl-ico:hover,.dl-btn:hover{border-color:var(--accent)}
.dl-ico:focus-visible,.dl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.src{font-size:11px;color:var(--faint);overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{color:var(--faint);font-size:12px;line-height:1.7}
mark{background:color-mix(in srgb,var(--motie) 30%,transparent);color:inherit;border-radius:2px}

@media (max-width:820px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:first-child{grid-column:1/-1}
  .detail-in{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){ h1{font-size:23px} .tile .t-val{font-size:19px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">2027년도 정부 예산안 · 세출 세부사업별 사업설명자료</div>
    <h1>2027 AI 예산 뷰어</h1>
    <p id="lede"></p>

  <section aria-label="부처별 요약" style="display:flex;flex-direction:column;gap:10px">

  <div class="toolbar" role="toolbar" aria-label="보기 설정">

    <div class="seg" id="stF" aria-label="사업 성격">
      <button data-v="" aria-pressed="true">전체</button><button data-v="신규" aria-pressed="false">신규</button><button data-v="계속" aria-pressed="false">계속</button>

    <select id="sort" aria-label="정렬">
      <option value="b">2027 정부안 큰 순</option>

      <option value="dn">감액 큰 순</option>
      <option value="n">사업명 순</option>

    <div class="seg" id="unitF" aria-label="금액 단위">

  </div>

  <main id="list" style="display:flex;flex-direction:column;gap:28px"></main>

  <footer id="foot"></footer>
</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{s=esc(s);if(!S.q)return s;const q=S.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(q,'gi'),m=>'<mark>'+m+'</mark>');};
const U=()=>S.unit==='eok'?'억원':'백만원';
const fmt=v=>{if(S.unit==='eok'){const x=v/100;return x.toLocaleString('ko-KR',{maximumFractionDigits:x>=100?0:1});}return v.toLocaleString('ko-KR');};
const pct=p=>Math.abs(p).toFixed(1);
const delta=(a,b)=>{const d=b-a;if(!a&&b)return `<span class="delta up num">순증<small>신규 편성</small></span>`;
  if(a&&!b)return `<span class="delta down num">순감<small>미편성</small></span>`;
  if(!d)return `<span class="delta flat num">전년 동</span>`;
  const p=(d/a*100);return `<span class="delta ${d>0?'up':'down'} num">${d>0?'+':'△'}${fmt(Math.abs(d))}<small>${d>0?'+':'△'}${pct(p)}%</small></span>`;};
const isRnd=r=>/R&D/.test(r.n);
const hay=r=>[r.n,r.code,r.prog,r.unit,r.exe,r.team,r.office,...r.items.flatMap(i=>[i.n,i.desc,i.goal])].join(' ').toLowerCase();
DATA.forEach(r=>r._h=hay(r));
const MAX=Math.max(...DATA.map(r=>r.b));

function tiles(){
  const t=(key,label,c,rows)=>{const n=rows.filter(r=>r.st==='신규').length;
    return `<button class="tile${rows.length?'':' zero'}" data-dept="${key}" aria-pressed="${S.dept===key}" style="--c:${c}">
      <span class="t-name">${label}</span>
      <span class="t-val num">${rows.length}<u>개 사업</u></span>
      <span class="t-sub">신규 ${n} · 계속 ${rows.length-n}</span></button>`};
  const all=scope();
  $('#tiles').innerHTML=t('','전체','var(--ink)',all)+DEPTS.map(d=>t(d.k,d.k,d.c,all.filter(r=>r.d===d.k))).join('');
  $('#lede').textContent=S.view==='vc'
    ?`AIRI 선별 과제 ${DATA.length}개 중 브이씨텍과 협업해 볼 만한 세부사업 ${all.length}개입니다. 행을 누르면 내역사업과 산출근거가 열립니다.`
    :`과기정통부·문체부·산업통상부·중기부 2027년 정부 예산안 중 AIRI 사업과 연관성이 있어 보이는 세부사업 ${DATA.length}개를 선별해 정리했습니다. 행을 누르면 내역사업과 산출근거가 열립니다.`;
  $('#cnt-all').textContent=DATA.length;$('#cnt-vc').textContent=DATA.filter(r=>r.vc).length;
  document.querySelectorAll('#viewF button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.view));
}

function filtered(){
  let rows=scope().filter(r=>(!S.dept||r.d===S.dept)&&(!S.st||r.st===S.st)&&(!S.q||r._h.includes(S.q.toLowerCase())));
  const f={b:(x,y)=>y.b-x.b,d:(x,y)=>(y.b-y.a)-(x.b-x.a),dn:(x,y)=>(x.b-x.a)-(y.b-y.a),n:(x,y)=>x.n.localeCompare(y.n,'ko')}[S.sort];
  return rows.sort(f);
}

function detail(r,c){
  const maxI=Math.max(...r.items.map(i=>Math.max(i.a,i.b)),1);
  const items=r.items.map(i=>{const ended=!i.b&&i.a;
    return `<div class="item${ended?' ended':''}">
      <div class="i-name">${hl(i.n)}</div>
      <div class="i-nums num"><span class="from">${fmt(i.a)} →</span> <b>${fmt(i.b)}</b> ${delta(i.a,i.b)}</div>
      <div class="ibar"><i style="width:${i.b/maxI*100}%"></i></div>
      ${i.desc?`<div class="i-desc">${hl(i.desc.replace(/^[-\s]+/,''))}</div>`:(ended?`<div class="i-goal">2027년 정부안 미편성 (종료·조정)</div>`:'')}
      ${i.goal?`<div class="i-goal"><b>목적</b> ${hl(i.goal)}</div>`:''}
      ${i.calc.length||i.why?`<details><summary>산출근거 보기</summary><div class="calc">${i.why?esc(i.why)+'\n\n':''}${esc(i.calc.join('\n'))}</div></details>`:''}
    </div>`}).join('');
  const hmax=Math.max(...r.hist.map(h=>h[1]),1);
  const hist=r.hist.length?`<div><h4>최근 5년 사업비 (${U()})</h4><div class="hist">${r.hist.map((h,ix)=>`<div class="${ix===r.hist.length-1?'cur':''}" title="${h[0]} ${fmt(h[1])}${U()}"><span class="num">${h[1]?fmt(h[1]):'-'}</span><i style="height:${h[1]/hmax*44}px"></i><span>'${String(h[0]).slice(2,4)}</span></div>`).join('')}</div></div>`:'';
  const kpi=r.kpi.length?`<div><h4>성과지표 (2027 목표)</h4><div class="kpi">${r.kpi.map(k=>`<div><span>${esc(k[0])}</span><b>${esc(k[1]&&k[1]!=='-'?k[1]:'—')}</b></div>`).join('')}</div></div>`:'';
  return `<div class="detail-in" style="--c:${c}">
    <div class="info">
      <dl>
        <dt>소관</dt><dd>${esc(r.office)} ${esc(r.team)}</dd>
        <dt>회계</dt><dd>${esc(r.acc)}</dd>
        <dt>지원형태</dt><dd>${esc(r.sup)}</dd>
        <dt>시행주체</dt><dd>${hl(r.exe)}</dd>
        <dt>사업기간</dt><dd>${esc(r.period)}</dd>
        <dt>수혜자</dt><dd>${esc(r.ben)}</dd>
        <dt>부처 요구액</dt><dd class="num">${fmt(r.req)} ${U()}</dd>
        <dt>'25 결산</dt><dd class="num">${fmt(r.y25)} ${U()}</dd>
      </dl>
      ${dlLink(r,'dl-btn','원문 HWPX 내려받기')}
      ${!DOWNLOADS&&r.file?`<div class="src">원문: ${esc(r.file.split('/').pop())}</div>`:''}
      ${hist}${kpi}
    </div>
    <div class="items"><h4>내역사업 ${r.items.length}개 · '26 → '27 정부안 (${U()})</h4>${items}</div>
  </div>`;
}

function render(){
  try{localStorage.setItem('budget-view',JSON.stringify({unit:S.unit,sort:S.sort,view:S.view}));}catch(e){}
  tiles();
  const rows=filtered();
  const html=DEPTS.filter(d=>!S.dept||d.k===S.dept).map(d=>{
    const rs=rows.filter(r=>r.d===d.k);if(!rs.length)return '';
    return `<section class="dept" style="--c:${d.c}">
      <div class="dept-head"><h2>${d.full}</h2><span class="meta">${rs.length}개 사업</span></div>
      <div class="tbl-wrap"><table class="main">
        <thead><tr><th>세부사업</th><th>구분</th><th class="r">2026 예산<br><small>(${U()})</small></th><th class="r">2027 정부안<br><small>(${U()})</small></th><th class="r">증감<br><small>(${U()})</small></th><th class="r">내역</th>${DOWNLOADS?'<th class="r">원문</th>':''}</tr></thead>
        <tbody>${rs.map(r=>{const id=r.code||r.n,o=S.open.has(id);
          return `<tr class="row${o?' open':''}" data-id="${esc(id)}" tabindex="0" aria-expanded="${o}">
            <td><div class="p-name"><span class="chev">›</span><span>${hl(r.n)}</span></div>
              <div class="p-sub"><span class="code">${esc(r.code)}</span> · ${esc(r.prog)} › ${esc(r.unit)} · ${hl(r.exe)}</div></td>
            <td><div class="tags"><span class="pill ${r.st==='신규'?'new':'cont'}">${esc(r.st)}</span>${isRnd(r)?'<span class="pill rnd">R&amp;D</span>':''}${r.vc&&S.view==='all'?'<span class="pill vc">브이씨텍</span>':''}</div></td>
            <td class="r num">${fmt(r.a)}</td>
            <td class="r"><div class="val num">${fmt(r.b)}</div><div class="bar"><i style="width:${r.b/MAX*100}%"></i></div></td>
            <td class="r">${delta(r.a,r.b)}</td>
            <td class="r num">${r.items.filter(i=>i.b).length}</td>
            ${DOWNLOADS?`<td class="r">${dlLink(r,'dl-ico','HWPX')}</td>`:''}</tr>
            ${o?`<tr class="detail"><td colspan="${DOWNLOADS?7:6}">${detail(r,d.c)}</td></tr>`:''}`}).join('')}</tbody>
      </table></div></section>`}).join('');
  $('#list').innerHTML=html||`<div class="empty">조건에 맞는 사업이 없습니다. 검색어나 필터를 바꿔 보세요.</div>`;
  $('#toggleAll').textContent=rows.length&&rows.every(r=>S.open.has(r.code||r.n))?'모두 접기':'모두 펼치기';
  document.querySelectorAll('#stF button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.st));
  document.querySelectorAll('#unitF button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.unit));
  $('#sort').value=S.sort;
}

$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;S.dept=S.dept===t.dataset.dept?'':t.dataset.dept;render();});
$('#viewF').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.v===S.view)return;S.view=b.dataset.v;S.dept='';render();});
$('#stF').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.st=b.dataset.v;render();});
$('#unitF').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.unit=b.dataset.v;render();});
$('#sort').addEventListener('change',e=>{S.sort=e.target.value;render();});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();
  if(S.q){filtered().forEach(r=>{if(r.items.some(i=>(i.n+i.desc+i.goal).toLowerCase().includes(S.q.toLowerCase())))S.open.add(r.code||r.n);});}
  render();},150);});
$('#toggleAll').addEventListener('click',()=>{const rows=filtered(),all=rows.every(r=>S.open.has(r.code||r.n));rows.forEach(r=>all?S.open.delete(r.code||r.n):S.open.add(r.code||r.n));render();});
const toggle=tr=>{const id=tr.dataset.id;S.open.has(id)?S.open.delete(id):S.open.add(id);render();const n=document.querySelector(`tr.row[data-id="${CSS.escape(id)}"]`);n&&n.focus({preventScroll:true});};
$('#list').addEventListener('click',e=>{if(e.target.closest('.detail')||e.target.closest('a'))return;const tr=e.target.closest('tr.row');tr&&toggle(tr);});
$('#list').addEventListener('keydown',e=>{const tr=e.target.closest('tr.row');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(tr);}});
$('#foot').innerHTML=`출처: 각 부처 「2027년도 세출 세부사업별 사업설명자료(정부 예산안)」 ${DATA.length}건. 금액은 2026년 본예산(기금은 계획액)과 2027년 정부안 기준이며, 원문 단위는 백만원입니다. 증감 표기는 예산서 관례를 따르며 △는 감소(마이너스)를 뜻합니다. 사업기간·산출근거 등 문구는 원문 그대로 옮겼습니다.${DOWNLOADS?' 각 사업의 원문 HWPX는 표의 ‘원문’ 열에서 내려받을 수 있습니다.':''}`;
render();
</script>

</body></html>
